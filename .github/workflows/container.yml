#
# Builds the container image (container/Containerfile) and pushes it to
# ghcr.io/<owner>/labaz, tagged as the git tag, or as "latest" for master.

name: container

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/labaz:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
